<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-2">Filtrar por</div>
                    <div class="col-md-4">
                        <input [(ngModel)]="listFilter" type="text" class="form-control" placeholder="Ingrese el nombre de su heroe">
                    </div>
                </div>
    
                <div class="row">
                    <div class=""col-md-6>
                        <h3>Filtro:{{listFilter}} </h3>
                    </div>
                </div>

                <div class="table-responsive">
                    <div class="table-responsive">
                        <table *ngIf="heroes.length>0" class="table table-striped">
                            <thead>
                                <tr>
                                    <th><button (click)="showImage()" class="btn btn-primary">{{muestraImage?'Ocultar ': 'Muestra '}}Imagen</button> </th>
                                    <th>Nombre</th>
                                    <th>Descripccion</th>
                                    <th>Raza</th>
                                    <th>Ki</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let heroe of heroes | heroesFilter:listFilter">
                                    <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                                    [style.width.px]="imageWidth"
                                    [style.margin.px]="imageMargin"
    
                                /></td>
                                    <td>{{heroe.nombre | uppercase}}</td>
                                    <td>{{heroe.description}}</td>
                                    <td>{{heroe.race}}</td>
                                    <td>{{heroe.ki}}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
