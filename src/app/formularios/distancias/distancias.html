<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <body>
        <div class="container">
            <div class="raw">
                <div class="col-6">
                    <form action="">
                        <div class="form-group pt-4">
                            <label for="num1">Numero 1: </label>
                            <input [(ngModel)]="num1" name="num1" type="text" id="num1" class="form-control" placeholder="Ingrese numero 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Numero 2: </label>
                            <input [(ngModel)]="num2" type="text" id="num2" name="num2" class="form-control" placeholder="Ingrese numero 2">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num3">Numero 3: </label>
                            <input [(ngModel)]="num3" type="text" id="num3" name="num3" class="form-control" placeholder="Ingrese numero 3">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num4">Numero 4: </label>
                            <input [(ngModel)]="num4" type="text" id="num4" name="num4" class="form-control" placeholder="Ingrese numero 4">
                        </div>
                        <br>
                        <button (click)="distancia()" type="button" class="btn btn-primary"> Calcular</button>
                    </form>
                </div>
        
                <div class="col-6">
                    <h2>Resultado: {{resultado}}</h2>
                </div>
            </div>
        </div>
    </body>
</html>
