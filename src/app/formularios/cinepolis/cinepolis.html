<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinepolis - Compra de Boletos</title>
    <link rel="stylesheet" href="cinepolis.css">
</head>
    <body>                 
                <!-- Encabezado Estilo Franquicia -->
                <div class="card-header bg-primary text-white text-center py-4">
                <h1 class="fw-bold mb-1"><i class="fa fa-film text-warning"></i> Cinépolis</h1>
                <p class="mb-0 text-light tracking-wide">LA CAPITAL DEL CINE</p>
                </div>

                <div class="card-body bg-custom-blue p-4">
                
                <!-- Mensajes de Alerta / Error -->
                <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
                    <i class="fa fa-exclamation-triangle"></i> {{ mensajeError }}
                </div>

                <div *ngIf="mensajeExito" class="alert alert-success" role="alert">
                    <i class="fa fa-check-circle"></i> {{ mensajeExito }}
                </div>

                <div class="row">
                    <!-- SECCIÓN ENTRADAS -->
                    <div class="col-md-7 border-end border-secondary">
                    <fieldset class="border p-3 rounded mb-3 bg-white shadow-sm">
                        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">  Datos de compra  </legend>
                        
                        <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">Nombre:</label>
                        <input 
                            id="nombre" 
                            type="text" 
                            class="form-control" 
                            [(ngModel)]="nombre" 
                            placeholder="Ingrese nombre del comprador">
                        </div>

                        <div class="mb-3">
                        <label for="compradores" class="form-label fw-semibold">Cantidad compradores:</label>
                        <input 
                            id="compradores" 
                            type="number" 
                            class="form-control" 
                            [(ngModel)]="cantidadCompradores" 
                            min="1">
                        </div>

                        <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Tarjeta CINECO:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tarjetaCineco" id="cinecoSi" value="si" [(ngModel)]="tieneTarjetaCineco">
                            <label class="form-check-label" for="cinecoSi">Sí</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tarjetaCineco" id="cinecoNo" value="no" [(ngModel)]="tieneTarjetaCineco">
                            <label class="form-check-label" for="cinecoNo">No</label>
                        </div>
                        </div>

                        <div class="mb-3">
                        <label for="boletas" class="form-label fw-semibold">Cantidad De boletos:</label>
                        <input 
                            id="boletas" 
                            type="number" 
                            class="form-control" 
                            [(ngModel)]="cantidadBoletas" 
                            min="1">
                        <small class="text-muted">Máximo 7 boletos por comprador.</small>
                        </div>
                    </fieldset>
                    </div>

                    <!-- SECCIÓN SALIDAS -->
                    <div class="col-md-5 d-flex flex-column justify-content-between">
                    <fieldset class="border p-3 rounded mb-3 bg-white shadow-sm h-100">
                        <legend class="float-none w-auto px-2 fs-5 fw-bold text-primary">Pago</legend>
                        
                        <div class="text-center mt-4">
                        <label class="form-label fw-bold text-secondary">Total a pagar</label>
                        <div class="p-3 bg-light border rounded fs-3 fw-bold text-warning">
                            ${{ totalPagar | number:'1.0-2' }}
                        </div>
                        </div>
                    </fieldset>
                    </div>
                </div>

                <!-- SECCIÓN ACCIONES -->
                <div class="row mt-3">
                    <div class="col-12">
                    <fieldset class="border p-3 rounded bg-white shadow-sm text-center">
                        <button class="btn btn-primary px-4 me-3 fw-bold" (click)="procesarCompra()">
                        <i class="fa fa-calculator"></i>  Pagar  
                        </button>
                        <button class="btn btn-secondary px-4 fw-bold" (click)="salir()">
                        <i class="fa fa-sign-out"></i> Nueva compra
                        </button>
                    </fieldset>
                    </div>
                </div>

                </div>
    </body>
</html>
