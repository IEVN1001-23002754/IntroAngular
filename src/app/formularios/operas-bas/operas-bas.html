<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
    <body>
        <div class="container">
            <div class="raw">
                <div class="col-6">
                    <form action="">
                        <div class="form-group pt-4">
                            <label for="num1">Numero 1: </label>
                            <input [(ngModel)]="num1" name="num1" type="text" id="num1" class="form-control" placeholder="Ingrese numero 1">
                        </div>
                        <div class="form-group pt-4">
                            <label for="num2">Numero 2: </label>
                            <input [(ngModel)]="num2" type="text" id="num2" name="num2" class="form-control" placeholder="Ingrese numero 2">
                        </div>
                        <br>
                        <!-- 
                        <button (click)="sumar()" type="button" class="btn btn-primary">Sumar</button>
                        <br>
                        <button (click)="restar()" type="button" class="btn btn-primary">Restar</button>
                        <br>
                        <button (click)="division()" type="button" class="btn btn-primary">Division</button>
                        <br>
                        <button (click)="multiplicacion()" type="button" class="btn btn-primary">Multiplicacion</button>
                        -->
                        <label>Seleccione una operación:</label>

                        <div>
                            <input type="radio" name="operacion" value="sumar" [(ngModel)]="operacion">
                            <label> Sumar</label>
                        </div>
                        
                        <div>
                            <input type="radio" name="operacion" value="restar" [(ngModel)]="operacion">
                            <label>Restar</label>
                        </div>
                        
                        <div>
                            <input type="radio" name="operacion" value="division" [(ngModel)]="operacion">
                            <label>Division</label>
                        </div>
                        
                        <div>
                            <input type="radio" name="operacion" value="multiplicacion" [(ngModel)]="operacion">
                            <label>Multiplicación</label>
                        </div>
                        <br>
                        <button (click)="calcular()" type="button" class="btn btn-primary"> Calcular</button>
                    </form>
                </div>
                <div class="col-6">        
                    <h2>Resultado: {{resultado}}</h2>
                </div>
            </div>
        </div>
    </body>
</html>
